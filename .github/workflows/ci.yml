# Build and run unit tests on Ubuntu. FetchContent (Sophus, DBoW2, googletest, Ceres if needed)
# requires network on the runner.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # SuiteSparse provides CXSparse/libcxsparse, which Ceres links against.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            libopencv-dev \
            libeigen3-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libsuitesparse-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: run_mono --help
        run: ./build/run_mono --help

      - name: Regression gate script (syntax)
        run: |
          python3 -m py_compile scripts/eval_lib.py scripts/check_regression_gate.py scripts/build_leaderboard.py scripts/print_ate_mean.py scripts/generate_ci_test_data.py scripts/run_ci_smoke_regression.py
          bash -n scripts/download_ci_test_data.sh
          python3 scripts/generate_ci_test_data.py --help
          python3 scripts/run_ci_smoke_regression.py --help
          python3 scripts/check_regression_gate.py --help
          python3 scripts/build_leaderboard.py --help
          python3 scripts/build_leaderboard.py --dry-run

      - name: CI regression smoke test
        run: |
          bash scripts/download_ci_test_data.sh
          # Regenerate with a deterministic scene that consistently initializes in CI.
          python3 scripts/generate_ci_test_data.py --output data/ci_test --frames 10 --point-count 300 --seed 1
          python3 scripts/run_ci_smoke_regression.py --build build --data data/ci_test --expected-poses 10 --max-frames 10 --max-mean-ate-m 0.5
